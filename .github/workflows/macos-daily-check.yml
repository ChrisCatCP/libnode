name: Macos

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  update:
    strategy:
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: arm64
            os: macos-14
            is_arm: true
          - arch: amd64
            os: macos-13
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag branch
        id: tag_branch
        run: |
          if [ "${GITHUB_REF#refs/tags/}" = "$GITHUB_REF" ]; then
            echo "matched=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch origin main:refs/remotes/origin/main
          tag_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          if git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "matched=true" >> "$GITHUB_OUTPUT"
          else
            echo "matched=false" >> "$GITHUB_OUTPUT"
            echo "Tag commit $tag_commit is not on main; skipping."
          fi

      - name: Setup ccache
        if: steps.tag_branch.outputs.matched == 'true'
        uses: actions/cache@v4
        with:
          path: .ccache
          save-always: true
          key: ${{ github.workflow }}-${{ matrix.arch }}-${{ hashFiles('**/version.txt') }}
          restore-keys: |
            ${{ github.workflow }}-${{ matrix.arch }}-${{ hashFiles('**/version.txt') }}
            ${{ github.workflow }}-${{ matrix.arch }}-

      - name: Install building tools
        if: steps.tag_branch.outputs.matched == 'true'
        run: |
          sudo chown -R $(whoami) $(brew --prefix)/*

          # homebrew fails to update python 3.9.1 to 3.9.1.1 due to unlinking failure
          sudo rm -f /usr/local/bin/2to3 || true
          # homebrew fails to update python from 3.9 to 3.10 due to another unlinking failure
          sudo rm -f /usr/local/bin/idle3 || true
          sudo rm -f /usr/local/bin/pydoc3 || true
          sudo rm -f /usr/local/bin/python3 || true
          sudo rm -f /usr/local/bin/python3-config || true

          brew install git node ninja nasm ccache

      - name: Run the script
        if: steps.tag_branch.outputs.matched == 'true'
        env:
          CC: "gcc"
          CXX: "g++"
          ARCH: ${{ matrix.arch }}
        run: |
          export CCACHE_COMPRESS="true"
          export CCACHE_BASEDIR="$GITHUB_WORKSPACE"
          export CCACHE_DIR="$CCACHE_BASEDIR/.ccache"
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          mkdir -p "$CCACHE_DIR"

          node index.js

      - name: Create archive
        if: steps.tag_branch.outputs.matched == 'true'
        run: |
          rm -rf package
          mkdir -p package/lib

          cd node
          python3 tools/install.py install --headers-only --dest-dir ../package --prefix /
          cd ..

          cd node/out/Release
          ln -sf "$(basename "$(ls libnode.*.dylib | head -n 1)")" libnode.dylib
          cd ../../..

          cp -P node/out/Release/libnode*.dylib package/lib/
          cp node/out/Release/node package/
          tar -C package -cJf "node/out/Release/libnode-${{ matrix.arch }}-macos.tar.xz" include lib node

      - name: Upload binaries to release
        if: steps.tag_branch.outputs.matched == 'true'
        uses: svenstaro/upload-release-action@v2
        with:
          overwrite: true
          tag: ${{ github.ref }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: node/out/Release/libnode-${{ matrix.arch }}-macos.tar.xz
