name: Linux

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: arm64
            is_arm: true
    container:
      image: ubuntu:devel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          save-always: true
          key: ${{ github.workflow }}-${{ matrix.arch }}-${{ hashFiles('**/version.txt') }}
          restore-keys: |
            ${{ github.workflow }}-${{ matrix.arch }}-${{ hashFiles('**/version.txt') }}
            ${{ github.workflow }}-${{ matrix.arch }}-

      - name: Install building tools
        run: |
          apt-get install --yes ca-certificates curl gnupg && curl -sL https://deb.nodesource.com/setup_21.x | bash -
          apt-get update
          apt-get install --yes git nodejs python3 python3-pip gcc g++ make nasm ccache linux-libc-dev linux-libc-dev-arm64-cross binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Check tag branch
        id: tag_branch
        run: |
          if [ "${GITHUB_REF#refs/tags/}" = "$GITHUB_REF" ]; then
            echo "matched=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch origin main:refs/remotes/origin/main
          tag_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          if git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "matched=true" >> "$GITHUB_OUTPUT"
          else
            echo "matched=false" >> "$GITHUB_OUTPUT"
            echo "Tag commit $tag_commit is not on main; skipping."
          fi

      - name: Run the script
        if: steps.tag_branch.outputs.matched == 'true'
        env:
          ARCH: ${{ matrix.arch }}
          CC: "${{ matrix.is_arm && 'aarch64-linux-gnu-gcc' || 'gcc' }}"
          CXX: "${{ matrix.is_arm && 'aarch64-linux-gnu-g++' || 'g++' }}"
          # We don't want these variables to be set for AMD64.
          CC_host: "${{ matrix.is_arm && 'gcc' || null }}"
          CXX_host: "${{ matrix.is_arm && 'g++' || null }}"
          AS: "${{ matrix.is_arm && 'aarch64-linux-gnu-as' || null }}"
          LD: "${{ matrix.is_arm && 'aarch64-linux-gnu-ld' || null }}"
          RANLIB: "${{ matrix.is_arm && 'aarch64-linux-gnu-ranlib' || null }}"
        run: |
          export CCACHE_COMPRESS="true"
          export CCACHE_BASEDIR="$GITHUB_WORKSPACE"
          export CCACHE_DIR="$CCACHE_BASEDIR/.ccache"
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          mkdir -p "$CCACHE_DIR"

          node index.js

      - name: Create archive
        if: steps.tag_branch.outputs.matched == 'true'
        run: |
          rm -rf package
          mkdir -p package/lib

          cd node
          python3 tools/install.py install --headers-only --dest-dir ../package --prefix /
          cd ..

          ln -sf libnode.so.* node/out/Release/libnode.so
          cp -P node/out/Release/libnode.so* package/lib/
          cp node/out/Release/node package/
          tar -C package -cJf "node/out/Release/libnode-${{ matrix.arch }}-linux.tar.xz" include lib node

      - name: Upload binaries to release
        if: steps.tag_branch.outputs.matched == 'true'
        uses: svenstaro/upload-release-action@v2
        with:
          overwrite: true
          tag: ${{ github.ref }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: node/out/Release/libnode-${{ matrix.arch }}-linux.tar.xz
