name: Windows Node 22

on:
  push:
    tags:
      - "v22.22.3"
  workflow_dispatch:

env:
  SOURCE_TAG: v22.22.3

jobs:
  update:
    name: Windows Node 22 (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x86]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag branch
        id: tag_branch
        shell: pwsh
        run: |
          if (-not $env:GITHUB_REF.StartsWith('refs/tags/')) {
            "matched=true" >> $env:GITHUB_OUTPUT
            exit 0
          }

          git fetch origin node22:refs/remotes/origin/node22
          $tagCommit = git rev-parse "$env:GITHUB_REF^{commit}"
          git merge-base --is-ancestor $tagCommit origin/node22
          if ($LASTEXITCODE -eq 0) {
            "matched=true" >> $env:GITHUB_OUTPUT
          } else {
            "matched=false" >> $env:GITHUB_OUTPUT
            Write-Host "Tag commit $tagCommit is not on node22; skipping."
          }

      - uses: MinoruSekine/setup-scoop@v3
        if: steps.tag_branch.outputs.matched == 'true'
        with:
          update_path: true
          run_as_admin: true
          scoop_update: true

      - name: Install building tools
        if: steps.tag_branch.outputs.matched == 'true'
        run: scoop install git nodejs python ninja nasm 7zip

      - name: Run the script
        if: steps.tag_branch.outputs.matched == 'true'
        env:
          ARCH: ${{ matrix.arch }}
          SOURCE_TAG: ${{ env.SOURCE_TAG }}
        run: node index.js

      - name: Create archive
        if: steps.tag_branch.outputs.matched == 'true'
        run: |
          if (Test-Path package) { Remove-Item -Recurse -Force package }
          New-Item -ItemType Directory -Force package\lib | Out-Null

          Push-Location node
          python tools\install.py install --headers-only --dest-dir ..\package --prefix /
          Pop-Location

          Copy-Item node\out\Release\libnode.* package\lib\
          Copy-Item node\out\Release\node.* package\
          7z a -mx9 "node\out\Release\libnode-${{ matrix.arch }}-windows.zip" package\include package\lib package\node.*

      - name: Upload binaries to release
        if: steps.tag_branch.outputs.matched == 'true'
        uses: svenstaro/upload-release-action@v2
        with:
          overwrite: true
          tag: ${{ env.SOURCE_TAG }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: node\out\Release\libnode-${{ matrix.arch }}-windows.zip
